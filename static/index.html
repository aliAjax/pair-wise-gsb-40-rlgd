<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海上搜救协调</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 20px;color:#17324d}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #cbd8e3;padding:8px;text-align:left}th{background:#edf5fb}code{background:#f2f5f7;padding:2px 5px}.card{background:#f7fbfe;border-left:5px solid #2784c7;padding:12px 16px}button{cursor:pointer;padding:3px 10px}input,select{padding:3px 6px}.st-merged{color:#1a7f37}.st-rejected{color:#c0392b}.st-pending{color:#b07d10}</style>
<h1>海上搜救协调</h1><div class="card">页面读取实时状态。业务写入通过 README 中的 JSON API 完成，并需要 <code>X-User</code>、<code>X-Role</code>。</div>
<h2>遇险事件</h2><table id="incidents"><thead><tr><th>编号</th><th>船名</th><th>状态</th><th>海况</th><th>负责机构</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>资源</h2><table id="assets"><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>航程</th></tr></thead><tbody></tbody></table>
<h2>搜索区域</h2><table id="areas"><thead><tr><th>编号</th><th>事件</th><th>状态</th><th>优先级</th><th>资源</th></tr></thead><tbody></tbody></table>
<h2>离线批次</h2><table id="batches"><thead><tr><th>批次编号</th><th>上传人</th><th>状态</th><th>待处理</th><th>成功</th><th>拒绝</th><th>接收时间</th></tr></thead><tbody></tbody></table>
<h2>离线记录回执</h2><div class="card">操作人 <input id="actor" value="coord-demo"> 角色 <select id="role"><option>coordinator</option><option>analyst</option><option>operator</option><option>field</option></select> — 被拒绝的记录可发起复查；复查中的记录由协调员或分析员处理。事件结束后只保留拒绝原因，时间线不再改动。</div>
<table id="records"><thead><tr><th>批次</th><th>事件编号</th><th>类型</th><th>状态</th><th>拒绝原因</th><th>复查备注</th><th>操作</th></tr></thead><tbody></tbody></table>
<h2>时间线</h2><ol id="timeline"></ol>
<script>
const BATCH_STATUS={received:'已接收',merged:'全部成功',partial:'部分成功',rejected:'全部拒绝',reviewing:'复查中'};
const RECORD_STATUS={merged:'成功',rejected:'拒绝',pending:'待处理(复查中)'};
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-User':document.querySelector('#actor').value,'X-Role':document.querySelector('#role').value},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){alert(d.error||'操作失败');return null}return d}
async function review(id){const note=prompt('复查说明（可选）','');if(note===null)return;const d=await post('/api/offline/review',{record_id:id,note});if(d)load()}
async function resolve(id,decision){const body={record_id:id,decision};if(decision==='merge'){const c=prompt('修正字段（JSON），留空按原数据合并','');if(c===null)return;if(c.trim()){try{body.corrections=JSON.parse(c)}catch(e){alert('修正内容不是有效 JSON');return}}}else{const r=prompt('拒绝原因','');if(r===null)return;body.reason=r}const d=await post('/api/offline/review/resolve',body);if(d)load()}
async function load(){const d=await fetch('/api/state').then(r=>r.json());const fill=(id,rows,cols)=>{document.querySelector('#'+id+' tbody').innerHTML=rows.map(r=>'<tr>'+cols.map(c=>`<td>${r[c]??''}</td>`).join('')+'</tr>').join('')};fill('incidents',d.incidents,['code','vessel_name','status','sea_state','lead_org','version']);fill('assets',d.assets,['name','kind','status','range_km']);fill('areas',d.search_areas,['code','incident_id','status','priority','assigned_asset_id']);
document.querySelector('#batches tbody').innerHTML=d.offline_batches.map(b=>`<tr><td>${b.client_batch_id}</td><td>${b.actor}</td><td>${BATCH_STATUS[b.status]||b.status}</td><td>${b.pending}</td><td class="st-merged">${b.merged}</td><td class="st-rejected">${b.rejected}</td><td>${b.received_at}</td></tr>`).join('');
const bmap=Object.fromEntries(d.offline_batches.map(b=>[b.id,b.client_batch_id]));
document.querySelector('#records tbody').innerHTML=d.offline_records.map(r=>{let op='';if(r.status==='rejected')op=`<button onclick="review(${r.id})">发起复查</button>`;if(r.status==='pending')op=`<button onclick="resolve(${r.id},'merge')">复查通过</button> <button onclick="resolve(${r.id},'reject')">维持拒绝</button>`;return `<tr><td>${bmap[r.batch_id]||r.batch_id}</td><td>${r.client_event_id}</td><td>${r.event_type}</td><td class="st-${r.status}">${RECORD_STATUS[r.status]||r.status}</td><td>${r.error||''}</td><td>${r.review_note||''}</td><td>${op}</td></tr>`}).join('');
document.querySelector('#timeline').innerHTML=d.timeline.slice(0,20).map(x=>`<li>${x.created_at} ${x.action} ${x.details}</li>`).join('')}load()
</script></html>
